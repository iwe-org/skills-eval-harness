name: Test Harbor evaluation harness

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.1"
          enable-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: uv sync --locked --all-groups
      - run: uv run skills-eval validate
      - run: uv run ruff check src tests
      - run: uv run pytest
      - run: uv run python -m compileall -q src tests
